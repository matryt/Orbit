name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.platform.os-name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os-name: macOS (Apple Silicon ARM64)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - os-name: Windows (x64)
            os: windows-latest
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      # Rust Cache: Dramatically speeds up builds (from ~18min to ~3min)
      - name: Rust Cache
        uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Build frontend and compile Tauri native bundles
      - name: Build and Package with Tauri
        uses: tauri-apps/tauri-action@2a8db2c169af2fdc695133781e27ecba52daea75 # v0.5.17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: Pour activer la signature Apple officielle et la notarisation
          # lorsque vous aurez un compte Apple Developer ($99/an), décommentez les lignes suivantes :
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Orbit v__VERSION__'
          releaseBody: |
            ### 🛸 Bienvenue dans Orbit v__VERSION__ !

            Orbit est un client desktop moderne, rapide et esthétique pour **SFTP** et **S3**, conçu avec **Tauri v2**, **Rust** et **React 19**.

            #### 📦 Téléchargement & Installation
            * **macOS (Apple Silicon ARM64 - M1/M2/M3/M4)** : Téléchargez le fichier `.dmg`.
              > **Premier lancement sur macOS** : L'application n'étant pas encore signée avec un certificat Apple payant ($99/an), exécutez cette commande une seule fois dans votre terminal si Gatekeeper bloque l'ouverture :
              > ```bash
              > xattr -cr /Applications/Orbit.app
              > ```
            * **Windows 10 / 11 (x64)** : Téléchargez l'installeur `.exe` (NSIS) ou `.msi`.
          releaseDraft: ${{ inputs.draft || false }}
          prerelease: false
          args: ${{ matrix.platform.args }}

  finalize-release:
    name: Finalize Release Notes
    needs: build-release
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Append Generated Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Generating release notes for tag $TAG..."
          
          # 1. Fetch auto-generated changelog
          CHANGELOG=$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$TAG" --jq .body)
          
          # 2. Fetch current release id and body
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .id)
          CURRENT_BODY=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .body)
          
          # 3. Concatenate and update release
          NEW_BODY="${CURRENT_BODY}

          ---
          ${CHANGELOG}"
          
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" -f body="$NEW_BODY"
          echo "Release notes successfully updated!"
