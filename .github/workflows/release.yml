name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: Build (${{ matrix.platform.os-name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os-name: macOS (Apple Silicon ARM64)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - os-name: Windows (x64)
            os: windows-latest
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      # Rust Cache: Dramatically speeds up builds (from ~18min to ~3min)
      - name: Rust Cache
        uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Build frontend and compile Tauri native bundles
      - name: Build and Package with Tauri
        uses: tauri-apps/tauri-action@2a8db2c169af2fdc695133781e27ecba52daea75 # v0.5.17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: Pour activer la signature Apple officielle et la notarisation
          # lorsque vous aurez un compte Apple Developer ($99/an), décommentez les lignes suivantes :
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Orbit v__VERSION__'
          releaseBody: |
            ### 🛸 Bienvenue dans Orbit v__VERSION__ !

            Orbit est un client desktop moderne, rapide et esthétique pour **SFTP** et **S3**, conçu avec **Tauri v2**, **Rust** et **React 19**.

            #### 📦 Téléchargement & Installation
            * **macOS (Apple Silicon ARM64 - M1/M2/M3/M4)** : Téléchargez le fichier `.dmg`.
              > **Premier lancement sur macOS** : L'application n'étant pas encore signée avec un certificat Apple payant ($99/an), exécutez cette commande une seule fois dans votre terminal si Gatekeeper bloque l'ouverture :
              > ```bash
              > xattr -cr /Applications/Orbit.app
              > ```
            * **Windows 10 / 11 (x64)** : Téléchargez l'installeur `.exe` (NSIS) ou `.msi`.
          releaseDraft: ${{ inputs.draft || false }}
          prerelease: false
          args: ${{ matrix.platform.args }}

      - name: Stage native bundles for provenance attestation
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          mkdir -p dist-bundles
          find src-tauri/target -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.app.tar.gz" \) -exec cp {} dist-bundles/ \;
          echo "=== Staged native bundles for attestation ==="
          ls -la dist-bundles

      - name: Attest Build Provenance (in-situ)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist-bundles/*'

  finalize-release:
    name: Finalize Release (Checksums & Attestations)
    needs: build-release
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets
          echo "=== Downloaded release assets ==="
          ls -lh release-assets

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          rm -f SHA256SUMS.txt checksum_table.md
          
          # Compute sha256 for all binary assets
          sha256sum * > SHA256SUMS.txt
          
          echo "=== Generated SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          
          # Build a formatted Markdown table
          TABLE="| Fichier | Empreinte SHA-256 |"$'\n'"| :--- | :--- |"
          while IFS= read -r line; do
            HASH=$(echo "$line" | awk '{print $1}')
            FILE=$(echo "$line" | awk '{$1=""; print $0}' | sed 's/^[ \t]*//')
            if [[ "$FILE" != "SHA256SUMS.txt" ]]; then
              TABLE="${TABLE}"$'\n'"| \`${FILE}\` | \`${HASH}\` |"
            fi
          done < SHA256SUMS.txt
          
          echo "$TABLE" > checksum_table.md

      - name: Upload SHA256SUMS to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release upload "$TAG" release-assets/SHA256SUMS.txt --clobber
          echo "SHA256SUMS.txt uploaded to release $TAG"

      - name: Commit SHA256SUMS to Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p checksums
          cp release-assets/SHA256SUMS.txt "checksums/${TAG}.sha256"
          cp release-assets/SHA256SUMS.txt SHA256SUMS.txt
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checksums/${TAG}.sha256 SHA256SUMS.txt
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): record sha256 checksums for ${TAG} [skip ci]"
            git push origin HEAD:develop || git push origin HEAD:main || echo "Protected branch prevented direct push, skipping git push."
          fi

      - name: Append Checksums and Notes to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          echo "Updating release description for tag $TAG..."
          
          # 1. Fetch current release notes
          gh release view "$TAG" --json body --jq .body > current_body.md
          
          # 2. Fetch auto-generated changelog
          gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$TAG" --jq .body > changelog.md
          
          # 3. Build security & integrity section
          cat << 'EOF' > security_section.md

          ### 🔒 Intégrité & Sécurité (SHA-256 & Attestations)

          EOF
          cat release-assets/checksum_table.md >> security_section.md
          cat << EOF >> security_section.md

          > [!TIP]
          > **Vérifier l'intégrité locale :**
          > * **macOS / Linux** : \`shasum -a 256 <fichier>\`
          > * **Windows (PowerShell)** : \`Get-FileHash <fichier> -Algorithm SHA256\`
          > * **Vérifier l'attestation officielle GitHub (Sigstore / SLSA)** :
          >   \`gh attestation verify <fichier> --owner ${{ github.repository_owner }}\`
          EOF
          
          # 4. Assemble complete release notes
          cat current_body.md > final_release_notes.md
          echo "" >> final_release_notes.md
          cat security_section.md >> final_release_notes.md
          echo "" >> final_release_notes.md
          echo "---" >> final_release_notes.md
          echo "" >> final_release_notes.md
          cat changelog.md >> final_release_notes.md
          
          # 5. Update release with the combined notes
          gh release edit "$TAG" --notes-file final_release_notes.md
          echo "Release notes successfully updated!"
