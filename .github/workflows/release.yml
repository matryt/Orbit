name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.platform.os-name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os-name: macOS (Universal Apple Silicon & Intel)
            os: macos-latest
            rust-target: universal-apple-darwin
            args: --target universal-apple-darwin
          - os-name: Windows (x64)
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform.rust-target }}

      # Add both macOS architectures if building universal binary
      - name: Add macOS targets for universal build
        if: matrix.platform.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      # Rust Cache: Dramatically speeds up builds (from ~18min to ~3min)
      - name: Rust Cache
        uses: swatinem/rust-cache@400e7407cfd7a091e5fbb6afec01ec146c432b7c # v2.7.7
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Build frontend and compile Tauri native bundles
      - name: Build and Package with Tauri
        uses: tauri-apps/tauri-action@ea1f12403fd95c98ee2fff70a34d5a818ceeb112 # v0.5.17
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: Pour activer la signature Apple officielle et la notarisation
          # lorsque vous aurez un compte Apple Developer ($99/an), décommentez les lignes suivantes :
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Orbit v__VERSION__'
          releaseBody: 'Voir les notes de version et les installeurs ci-dessous pour macOS (.dmg) et Windows (.exe / .msi).'
          releaseDraft: ${{ inputs.draft || false }}
          prerelease: false
          args: ${{ matrix.platform.args }}
