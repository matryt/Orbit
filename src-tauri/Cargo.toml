[package]
name = "orbit"
version = "0.1.2"
description = "Orbit - Modern S3 & SFTP Desktop Client"
authors = ["Orbit Team"]
edition = "2024"

[lib]
name = "orbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.5"
tokio = { version = "1.54.1", features = ["full"] }
async-trait = "0.1.92"
thiserror = "2.0.21"
keyring = "4.2.0"
dirs = "7.0.0"
russh = "0.65.1"
russh-sftp = "3.0.1"
chrono = "0.4.45"
tauri-plugin-dialog = "2.8.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
